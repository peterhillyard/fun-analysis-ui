<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <h1>Data Visualizer</h1>
    
    <div>
        <input type="file" id="zipFileInput1" accept=".zip" />
        <label for="zipFileInput1">Choose First ZIP file</label>
        <span style="margin-left: 20px;">
            <input type="file" id="zipFileInput2" accept=".zip" />
            <label for="zipFileInput2">Choose Second ZIP file</label>
        </span>
    </div>

    <div style="margin-top: 10px;">
        <label>
            <input type="checkbox" id="showBleTxIds" checked />
            Show BLE TX IDs
        </label>
        <label style="margin-left: 20px;">
            BLE Label:
            <select id="bleLabelOption">
                <option value="full">Full ID</option>
                <option value="last4" selected>Last 4 chars</option>
                <option value="none">No Label</option>
            </select>
        </label>
        <label style="margin-left: 20px;">
            <input type="checkbox" id="showBasestations" checked />
            Show Basestations
        </label>
        <label style="margin-left: 20px;">
            Basestation Coordinate:
            <select id="basestationCoordinateOption">
                <option value="augi_location" selected>Augi Location</option>
                <option value="room_centroid">Room Centroid</option>
            </select>
        </label>
        <label style="margin-left: 20px;">
            Basestation Label:
            <select id="basestationLabelOption">
                <option value="full">Full ID</option>
                <option value="last4" selected>Last 4 chars</option>
                <option value="none">No Label</option>
            </select>
        </label>
    </div>

    <div style="margin-top: 10px;">
        <label>
            Image 1 Opacity:
            <input type="range" id="image1Opacity" min="0" max="100" value="100" style="width: 200px; margin-left: 10px;" />
            <span id="image1OpacityValue">100%</span>
        </label>
        <label style="margin-left: 20px;">
            Image 2 Opacity:
            <input type="range" id="image2Opacity" min="0" max="100" value="50" style="width: 200px; margin-left: 10px;" />
            <span id="image2OpacityValue">50%</span>
        </label>
    </div>

    <div id="staticWindowInfo" style="margin-top: 20px; display: none;">
        <h3>Static Window</h3>
        <p><strong>Start:</strong> <span id="startTime"></span></p>
        <p><strong>End:</strong> <span id="endTime"></span></p>
        
        <div style="margin-top: 15px;">
            <label>
                <strong>Select BLE TX ID:</strong>
                <select id="bleTxIdSelector" style="margin-left: 10px;">
                    <option value="">-- Select a BLE TX ID --</option>
                </select>
            </label>
            <button id="toggleTableBtn" style="margin-left: 20px; padding: 5px 15px; cursor: pointer;">Hide Table</button>
        </div>
        
        <div id="bleDataTable" style="margin-top: 15px; display: none;">
            <h4>Coprocessor Hearing Count</h4>
            <table id="coprocessorTable" style="border-collapse: collapse; width: 100%; max-width: 600px;">
                <thead>
                    <tr style="background-color: #f0f0f0;">
                        <th style="border: 1px solid #ddd; padding: 8px; text-align: left; cursor: pointer;" data-column="coprocessorId">Coprocessor ID <span id="sort-coprocessorId"></span></th>
                        <th style="border: 1px solid #ddd; padding: 8px; text-align: left; cursor: pointer;" data-column="dataset">Dataset <span id="sort-dataset"></span></th>
                        <th style="border: 1px solid #ddd; padding: 8px; text-align: left; cursor: pointer;" data-column="count">Count <span id="sort-count"></span></th>
                        <th style="border: 1px solid #ddd; padding: 8px; text-align: left; cursor: pointer;" data-column="minRssi">Min RSSI <span id="sort-minRssi"></span></th>
                        <th style="border: 1px solid #ddd; padding: 8px; text-align: left; cursor: pointer;" data-column="maxRssi">Max RSSI <span id="sort-maxRssi"></span></th>
                        <th style="border: 1px solid #ddd; padding: 8px; text-align: left; cursor: pointer;" data-column="avgRssi">Avg RSSI <span id="sort-avgRssi"></span></th>
                    </tr>
                </thead>
                <tbody id="coprocessorTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div id="imageContainer" style="margin-top: 20px; position: relative; display: inline-block;">
        <img id="floorPlanImage1" style="max-width: 100%; display: none; position: relative;" />
        <img id="floorPlanImage2" style="max-width: 100%; display: none; position: absolute; top: 0; left: 0; opacity: 0.5;" />
        <svg id="linesContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></svg>
        <div id="dotsContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
        <div id="hoverInfo" style="position: absolute; display: none; background-color: rgba(0, 0, 0, 0.8); color: white; padding: 8px 12px; border-radius: 4px; font-size: 12px; pointer-events: none; z-index: 1000; white-space: nowrap;"></div>
    </div>

    <script>
        let aggregatedData1 = null;
        let aggregatedData2 = null;
        let bleData1 = null;
        let currentImageElement1 = null;
        let currentImageElement2 = null;
        let selectedBleTxId = null;
        let selectedCoprocessorId = null;
        let image1Opacity = 1.0;
        let image2Opacity = 0.5;
        let currentSortColumn = 'dataset';
        let currentSortDirection = 'asc';
        let currentTableData = [];
        
        function sortTableData(column) {
            if (currentSortColumn === column) {
                // Toggle direction if same column
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                // New column, default to ascending
                currentSortColumn = column;
                currentSortDirection = 'asc';
            }
            
            // Sort the data
            currentTableData.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];
                
                // Convert to numbers for numeric columns
                if (column === 'count' || column === 'dataset') {
                    valA = parseFloat(valA);
                    valB = parseFloat(valB);
                } else if (column === 'minRssi' || column === 'maxRssi' || column === 'avgRssi') {
                    valA = valA === 'N/A' ? -Infinity : parseFloat(valA);
                    valB = valB === 'N/A' ? -Infinity : parseFloat(valB);
                }
                
                if (valA < valB) return currentSortDirection === 'asc' ? -1 : 1;
                if (valA > valB) return currentSortDirection === 'asc' ? 1 : -1;
                return 0;
            });
            
            // Update sort indicators
            document.querySelectorAll('[id^="sort-"]').forEach(span => span.textContent = '');
            document.getElementById(`sort-${column}`).textContent = currentSortDirection === 'asc' ? '▲' : '▼';
            
            // Re-render table
            renderTableRows();
        }
        
        function renderTableRows() {
            const tableBody = document.getElementById('coprocessorTableBody');
            tableBody.innerHTML = '';
            
            if (currentTableData.length === 0) {
                const row = tableBody.insertRow();
                const cell = row.insertCell(0);
                cell.colSpan = 6;
                cell.style.cssText = 'border: 1px solid #ddd; padding: 8px; text-align: center; color: #666;';
                cell.textContent = 'No data found for this BLE TX ID';
            } else {
                currentTableData.forEach(entry => {
                    const row = tableBody.insertRow();
                    const cellId = row.insertCell(0);
                    const cellDataset = row.insertCell(1);
                    const cellCount = row.insertCell(2);
                    const cellMinRssi = row.insertCell(3);
                    const cellMaxRssi = row.insertCell(4);
                    const cellAvgRssi = row.insertCell(5);
                    
                    cellId.style.cssText = 'border: 1px solid #ddd; padding: 8px;';
                    cellDataset.style.cssText = 'border: 1px solid #ddd; padding: 8px; text-align: center;';
                    cellCount.style.cssText = 'border: 1px solid #ddd; padding: 8px;';
                    cellMinRssi.style.cssText = 'border: 1px solid #ddd; padding: 8px;';
                    cellMaxRssi.style.cssText = 'border: 1px solid #ddd; padding: 8px;';
                    cellAvgRssi.style.cssText = 'border: 1px solid #ddd; padding: 8px;';
                    
                    cellId.textContent = entry.coprocessorId;
                    cellDataset.textContent = entry.dataset;
                    cellCount.textContent = entry.count;
                    cellMinRssi.textContent = entry.minRssi;
                    cellMaxRssi.textContent = entry.maxRssi;
                    cellAvgRssi.textContent = entry.avgRssi;
                });
            }
        }
        
        function drawLinesToBasestations(bleTxId, bleCoordinates, scaleX, scaleY, datasetNum) {
            const linesContainer = document.getElementById('linesContainer');
            linesContainer.innerHTML = ''; // Clear existing lines
            
            // Clear any existing count labels
            const existingLabels = document.querySelectorAll('.ble-count-label');
            existingLabels.forEach(label => label.remove());
            
            selectedCoprocessorId = null; // Clear basestation selection
            
            const basestationCoordinateOption = document.getElementById('basestationCoordinateOption').value;
            const dotsContainer = document.getElementById('dotsContainer');
            
            // Process both datasets
            [1, 2].forEach(dsNum => {
                const aggregatedData = dsNum === 1 ? aggregatedData1 : aggregatedData2;
                const imgElement = dsNum === 1 ? currentImageElement1 : currentImageElement2;
                
                if (!bleData1 || !aggregatedData || !aggregatedData.augi_metadata || !imgElement) return;
                
                // Calculate scale factors for this image
                const imgScaleX = imgElement.clientWidth / imgElement.naturalWidth;
                const imgScaleY = imgElement.clientHeight / imgElement.naturalHeight;
                
                // Count how many times each coprocessor heard this BLE TX ID
                const heardByCoprocessors = {};
                bleData1.forEach(row => {
                    if (row.ble_tx_id === bleTxId) {
                        const coprocessorId = row.coprocessor_id;
                        if (coprocessorId) {
                            heardByCoprocessors[coprocessorId] = (heardByCoprocessors[coprocessorId] || 0) + 1;
                        }
                    }
                });
                
                // Draw lines to basestations that heard this BLE device
                aggregatedData.augi_metadata.forEach(item => {
                    if (heardByCoprocessors[item.coprocessor]) {
                        // Determine which coordinates to use for basestation
                        let coordinates;
                        if (basestationCoordinateOption === 'room_centroid') {
                            coordinates = item.room_centroid_coordinate_pixels;
                        } else {
                            coordinates = item.augi_location_coordinate_pixels;
                        }
                        
                        if (coordinates && coordinates.length === 2) {
                            const opacity = dsNum === 1 ? image1Opacity : image2Opacity;
                            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            line.setAttribute('x1', bleCoordinates[0] * imgScaleX);
                            line.setAttribute('y1', bleCoordinates[1] * imgScaleY);
                            line.setAttribute('x2', coordinates[0] * imgScaleX);
                            line.setAttribute('y2', coordinates[1] * imgScaleY);
                            line.setAttribute('stroke', `rgba(255, 165, 0, ${0.6 * opacity})`);
                            line.setAttribute('stroke-width', '2');
                            line.setAttribute('opacity', opacity);
                            linesContainer.appendChild(line);
                            
                            // Add count label near the basestation
                            const countLabel = document.createElement('div');
                            countLabel.className = 'ble-count-label';
                            countLabel.style.position = 'absolute';
                            countLabel.style.left = `${coordinates[0] * imgScaleX - 15}px`;
                            countLabel.style.top = `${coordinates[1] * imgScaleY - 15}px`;
                            countLabel.style.backgroundColor = `rgba(255, 165, 0, ${0.9 * opacity})`;
                            countLabel.style.color = 'white';
                            countLabel.style.fontWeight = 'bold';
                            countLabel.style.fontSize = '11px';
                            countLabel.style.padding = '2px 6px';
                            countLabel.style.borderRadius = '10px';
                            countLabel.style.border = '1px solid white';
                            countLabel.style.opacity = opacity;
                            countLabel.style.zIndex = '1000';
                            countLabel.style.pointerEvents = 'none';
                            countLabel.textContent = heardByCoprocessors[item.coprocessor];
                            dotsContainer.appendChild(countLabel);
                        }
                    }
                });
            });
        }
        
        function drawLinesToBleDevices(coprocessorId, basestationCoordinates, scaleX, scaleY, datasetNum) {
            const linesContainer = document.getElementById('linesContainer');
            linesContainer.innerHTML = ''; // Clear existing lines
            
            // Clear any existing count labels
            const existingLabels = document.querySelectorAll('.ble-count-label');
            existingLabels.forEach(label => label.remove());
            
            selectedBleTxId = null; // Clear BLE selection
            
            const dotsContainer = document.getElementById('dotsContainer');
            
            // Process both datasets
            [1, 2].forEach(dsNum => {
                const aggregatedData = dsNum === 1 ? aggregatedData1 : aggregatedData2;
                const imgElement = dsNum === 1 ? currentImageElement1 : currentImageElement2;
                
                if (!bleData1 || !aggregatedData || !aggregatedData.ble_tx_id_coordinates || !imgElement) return;
                
                // Calculate scale factors for this image
                const imgScaleX = imgElement.clientWidth / imgElement.naturalWidth;
                const imgScaleY = imgElement.clientHeight / imgElement.naturalHeight;
                
                // Count how many times this coprocessor heard each BLE TX ID
                const heardBleDevices = {};
                bleData1.forEach(row => {
                    if (row.coprocessor_id === coprocessorId) {
                        const bleTxId = row.ble_tx_id;
                        if (bleTxId) {
                            heardBleDevices[bleTxId] = (heardBleDevices[bleTxId] || 0) + 1;
                        }
                    }
                });
                
                // Draw lines to BLE devices that this basestation heard
                aggregatedData.ble_tx_id_coordinates.forEach(item => {
                    if (heardBleDevices[item.ble_tx_id]) {
                        if (item.coordinate_pixels && item.coordinate_pixels.length === 2) {
                            const opacity = dsNum === 1 ? image1Opacity : image2Opacity;
                            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            line.setAttribute('x1', basestationCoordinates[0] * imgScaleX);
                            line.setAttribute('y1', basestationCoordinates[1] * imgScaleY);
                            line.setAttribute('x2', item.coordinate_pixels[0] * imgScaleX);
                            line.setAttribute('y2', item.coordinate_pixels[1] * imgScaleY);
                            line.setAttribute('stroke', `rgba(0, 165, 255, ${0.6 * opacity})`);
                            line.setAttribute('stroke-width', '2');
                            line.setAttribute('opacity', opacity);
                            linesContainer.appendChild(line);
                            
                            // Add count label near the BLE device
                            const countLabel = document.createElement('div');
                            countLabel.className = 'ble-count-label';
                            countLabel.style.position = 'absolute';
                            countLabel.style.left = `${item.coordinate_pixels[0] * imgScaleX - 15}px`;
                            countLabel.style.top = `${item.coordinate_pixels[1] * imgScaleY - 15}px`;
                            countLabel.style.backgroundColor = `rgba(0, 165, 255, ${0.9 * opacity})`;
                            countLabel.style.color = 'white';
                            countLabel.style.fontWeight = 'bold';
                            countLabel.style.fontSize = '11px';
                            countLabel.style.padding = '2px 6px';
                            countLabel.style.borderRadius = '10px';
                            countLabel.style.border = '1px solid white';
                            countLabel.style.opacity = opacity;
                            countLabel.style.zIndex = '1000';
                            countLabel.style.pointerEvents = 'none';
                            countLabel.textContent = heardBleDevices[item.ble_tx_id];
                            dotsContainer.appendChild(countLabel);
                        }
                    }
                });
            });
        }
        
        function parseCsv(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',');
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const row = {};
                headers.forEach((header, index) => {
                    row[header.trim()] = values[index]?.trim();
                });
                data.push(row);
            }
            
            return data;
        }
        
        function generateCoprocessorTable(bleTxId) {
            if (!bleTxId || !bleData1) return;
            
            const tableBody = document.getElementById('coprocessorTableBody');
            tableBody.innerHTML = '';
            
            // Build maps of which coprocessors belong to which dataset
            const coprocessorToDataset = {};
            if (aggregatedData1 && aggregatedData1.augi_metadata) {
                aggregatedData1.augi_metadata.forEach(item => {
                    coprocessorToDataset[item.coprocessor] = 1;
                });
            }
            if (aggregatedData2 && aggregatedData2.augi_metadata) {
                aggregatedData2.augi_metadata.forEach(item => {
                    coprocessorToDataset[item.coprocessor] = 2;
                });
            }
            
            // Count how many times each coprocessor heard this BLE TX ID and calculate RSSI stats
            const coprocessorStats = {};
            bleData1.forEach(row => {
                if (row.ble_tx_id === bleTxId) {
                    const coprocessorId = row.coprocessor_id;
                    if (coprocessorId) {
                        const rssi = parseFloat(row.rssi);
                        if (!coprocessorStats[coprocessorId]) {
                            coprocessorStats[coprocessorId] = {
                                count: 0,
                                minRssi: Infinity,
                                maxRssi: -Infinity,
                                sumRssi: 0
                            };
                        }
                        coprocessorStats[coprocessorId].count++;
                        if (!isNaN(rssi)) {
                            coprocessorStats[coprocessorId].minRssi = Math.min(coprocessorStats[coprocessorId].minRssi, rssi);
                            coprocessorStats[coprocessorId].maxRssi = Math.max(coprocessorStats[coprocessorId].maxRssi, rssi);
                            coprocessorStats[coprocessorId].sumRssi += rssi;
                        }
                    }
                }
            });
            
            // Create entries with dataset information
            currentTableData = [];
            Object.entries(coprocessorStats).forEach(([coprocessorId, stats]) => {
                const dataset = coprocessorToDataset[coprocessorId] || '?';
                const avgRssi = stats.count > 0 ? (stats.sumRssi / stats.count).toFixed(1) : 'N/A';
                const minRssi = stats.minRssi !== Infinity ? stats.minRssi.toFixed(1) : 'N/A';
                const maxRssi = stats.maxRssi !== -Infinity ? stats.maxRssi.toFixed(1) : 'N/A';
                currentTableData.push({ 
                    coprocessorId, 
                    dataset, 
                    count: stats.count,
                    minRssi,
                    maxRssi,
                    avgRssi
                });
            });
            
            // Sort and render
            sortTableData(currentSortColumn);
            
            document.getElementById('bleDataTable').style.display = 'block';
        }
        
        function renderDots() {
            const dotsContainer = document.getElementById('dotsContainer');
            dotsContainer.innerHTML = ''; // Clear any existing dots
            
            const showBleTxIds = document.getElementById('showBleTxIds').checked;
            const showBasestations = document.getElementById('showBasestations').checked;
            const bleLabelOption = document.getElementById('bleLabelOption').value;
            const basestationLabelOption = document.getElementById('basestationLabelOption').value;
            const basestationCoordinateOption = document.getElementById('basestationCoordinateOption').value;
            
            // Process both datasets
            [1, 2].forEach(datasetNum => {
                const aggregatedData = datasetNum === 1 ? aggregatedData1 : aggregatedData2;
                const imgElement = datasetNum === 1 ? currentImageElement1 : currentImageElement2;
                
                if (!imgElement || !aggregatedData) return;
                
                // Get the scale factor between natural and displayed size
                const scaleX = imgElement.clientWidth / imgElement.naturalWidth;
                const scaleY = imgElement.clientHeight / imgElement.naturalHeight;
                
                // Display BLE transmitter dots
                if (showBleTxIds && aggregatedData.ble_tx_id_coordinates && aggregatedData.ble_tx_id_coordinates.length > 0) {
                    aggregatedData.ble_tx_id_coordinates.forEach(item => {
                        if (item.coordinate_pixels && item.coordinate_pixels.length === 2) {
                            const opacity = datasetNum === 1 ? image1Opacity : image2Opacity;
                            const dot = document.createElement('div');
                            dot.style.position = 'absolute';
                            dot.style.left = `${item.coordinate_pixels[0] * scaleX}px`;
                            dot.style.top = `${item.coordinate_pixels[1] * scaleY}px`;
                            dot.style.width = '10px';
                            dot.style.height = '10px';
                            dot.style.backgroundColor = 'red';
                            dot.style.borderRadius = '50%';
                            dot.style.transform = 'translate(-50%, -50%)';
                            dot.style.cursor = 'pointer';
                            dot.style.opacity = opacity;
                            dot.title = `Dataset ${datasetNum} - BLE TX ID: ${item.ble_tx_id}`;
                            
                            // Add click handler to draw lines
                            dot.addEventListener('click', function() {
                                if (selectedBleTxId === item.ble_tx_id) {
                                    // Deselect if clicking the same dot
                                    selectedBleTxId = null;
                                    document.getElementById('linesContainer').innerHTML = '';
                                    // Clear count labels
                                    const existingLabels = document.querySelectorAll('.ble-count-label');
                                    existingLabels.forEach(label => label.remove());
                                } else {
                                    selectedBleTxId = item.ble_tx_id;
                                    drawLinesToBasestations(item.ble_tx_id, item.coordinate_pixels, scaleX, scaleY, datasetNum);
                                }
                            });
                            
                            dotsContainer.appendChild(dot);
                            
                            // Add label next to the dot if not 'none'
                            if (bleLabelOption !== 'none') {
                                const opacity = datasetNum === 1 ? image1Opacity : image2Opacity;
                                const label = document.createElement('div');
                                label.style.position = 'absolute';
                                label.style.left = `${item.coordinate_pixels[0] * scaleX + 10}px`;
                                label.style.top = `${item.coordinate_pixels[1] * scaleY}px`;
                                label.style.transform = 'translateY(-50%)';
                                label.style.color = 'red';
                                label.style.fontWeight = 'bold';
                                label.style.fontSize = '12px';
                                label.style.whiteSpace = 'nowrap';
                                label.style.opacity = opacity;
                                label.style.textShadow = '1px 1px 2px white, -1px -1px 2px white, 1px -1px 2px white, -1px 1px 2px white';
                                
                                if (bleLabelOption === 'full') {
                                    label.textContent = item.ble_tx_id;
                                } else if (bleLabelOption === 'last4') {
                                    label.textContent = item.ble_tx_id.slice(-4);
                                }
                                
                                dotsContainer.appendChild(label);
                            }
                        }
                    });
                }
                
                // Display basestation dots
                if (showBasestations && aggregatedData.augi_metadata && aggregatedData.augi_metadata.length > 0) {
                    aggregatedData.augi_metadata.forEach(item => {
                        // Determine which coordinates to use
                        let coordinates;
                        if (basestationCoordinateOption === 'room_centroid') {
                            coordinates = item.room_centroid_coordinate_pixels;
                        } else {
                            coordinates = item.augi_location_coordinate_pixels;
                        }
                        
                        if (coordinates && coordinates.length === 2) {
                            const opacity = datasetNum === 1 ? image1Opacity : image2Opacity;
                            const dot = document.createElement('div');
                            dot.style.position = 'absolute';
                            dot.style.left = `${coordinates[0] * scaleX}px`;
                            dot.style.top = `${coordinates[1] * scaleY}px`;
                            dot.style.width = '10px';
                            dot.style.height = '10px';
                            dot.style.backgroundColor = 'blue';
                            dot.style.borderRadius = '50%';
                            dot.style.transform = 'translate(-50%, -50%)';
                            dot.style.cursor = 'pointer';
                            dot.style.opacity = opacity;
                            dot.title = `Dataset ${datasetNum} - Basestation ID: ${item.basestation_id}, Coprocessor: ${item.coprocessor}, Room id: ${item.room_id}`;
                            
                            // Add click handler to draw lines to BLE devices
                            dot.addEventListener('click', function() {
                                if (selectedCoprocessorId === item.coprocessor) {
                                    // Deselect if clicking the same dot
                                    selectedCoprocessorId = null;
                                    document.getElementById('linesContainer').innerHTML = '';
                                    // Clear count labels
                                    const existingLabels = document.querySelectorAll('.ble-count-label');
                                    existingLabels.forEach(label => label.remove());
                                } else {
                                    selectedCoprocessorId = item.coprocessor;
                                    drawLinesToBleDevices(item.coprocessor, coordinates, scaleX, scaleY, datasetNum);
                                }
                            });
                            
                            
                            dotsContainer.appendChild(dot);
                            
                            // Add label next to the dot if not 'none'
                            if (basestationLabelOption !== 'none') {
                                const opacity = datasetNum === 1 ? image1Opacity : image2Opacity;
                                const label = document.createElement('div');
                                label.style.position = 'absolute';
                                label.style.left = `${coordinates[0] * scaleX + 10}px`;
                                label.style.top = `${coordinates[1] * scaleY}px`;
                                label.style.transform = 'translateY(-50%)';
                                label.style.color = 'blue';

        async function processZipFile(file, datasetNum) {
            if (!file) {
                return;
            }
            
            if (!file.name.endsWith('.zip')) {
                console.error('Please select a ZIP file');
                return;
            }
            
            try {
                console.log(`Processing ZIP file ${datasetNum}: ${file.name}`);
                
                const zip = new JSZip();
                const contents = await zip.loadAsync(file);
                
                console.log(`Dataset ${datasetNum} - File sizes in ZIP archive:`);
                console.log('----------------------------');
                
                let floorPlanFile = null;
                let aggregatedJsonFile = null;
                let bleDataFile = null;
                
                Object.keys(contents.files).forEach(filename => {
                    const fileData = contents.files[filename];
                    if (!fileData.dir) {
                        console.log(`${filename}: ${fileData._data.uncompressedSize} bytes`);
                        
                        // Check if this is the floor_plan.jpg file
                        if (filename.endsWith('floor_plan.jpg') || filename === 'floor_plan.jpg') {
                            floorPlanFile = fileData;
                        }
                        
                        // Check if this is the aggregated.json file
                        if (filename.endsWith('manual_gt_data.json') || filename === 'manual_gt_data.json') {
                            aggregatedJsonFile = fileData;
                        }
                        
                        // Check if this is the ble_data.csv file
                        if (filename.endsWith('ble_data.csv') || filename === 'ble_data.csv') {
                            bleDataFile = fileData;
                        }
                    }
                });
                
                console.log('----------------------------');
                
                // Load the aggregated.json file if found
                if (aggregatedJsonFile) {
                    const jsonText = await aggregatedJsonFile.async('text');
                    const aggregatedData = JSON.parse(jsonText);
                    if (datasetNum === 1) {
                        aggregatedData1 = aggregatedData;
                    } else {
                        aggregatedData2 = aggregatedData;
                    }
                    console.log(`Dataset ${datasetNum} manual_gt_data.json loaded:`, aggregatedData);
                    
                    // Display static_window if available (only for dataset 1)
                    if (datasetNum === 1 && aggregatedData.static_window && aggregatedData.static_window.length === 2) {
                        document.getElementById('startTime').textContent = aggregatedData.static_window[0];
                        document.getElementById('endTime').textContent = aggregatedData.static_window[1];
                        document.getElementById('staticWindowInfo').style.display = 'block';
                        
                        console.log('Static window displayed:', aggregatedData.static_window);
                    }
                }
                
                // Load the ble_data.csv file if found (only from dataset 1, as it's the same for both)
                if (bleDataFile && datasetNum === 1) {
                    const csvText = await bleDataFile.async('text');
                    bleData1 = parseCsv(csvText);
                    console.log(`ble_data.csv loaded:`, bleData1.length, 'rows');
                    
                    // Populate BLE TX ID dropdown from ble_data.csv
                    if (bleData1 && bleData1.length > 0) {
                        const selector = document.getElementById('bleTxIdSelector');
                        // Clear existing options except the first one
                        selector.innerHTML = '<option value="">-- Select a BLE TX ID --</option>';
                        
                        // Get unique BLE TX IDs from the CSV data
                        const uniqueBleTxIds = [...new Set(bleData1.map(row => row.ble_tx_id).filter(id => id))];
                        uniqueBleTxIds.sort();
                        
                        uniqueBleTxIds.forEach(bleTxId => {
                            const option = document.createElement('option');
                            option.value = bleTxId;
                            option.textContent = bleTxId;
                            selector.appendChild(option);
                        });
                        
                        console.log(`Populated dropdown with ${uniqueBleTxIds.length} unique BLE TX IDs from ble_data.csv`);
                    }
                }
                
                // Display the floor plan image if found
                if (floorPlanFile) {
                    const blob = await floorPlanFile.async('blob');
                    const imageUrl = URL.createObjectURL(blob);
                    const imgElement = document.getElementById(`floorPlanImage${datasetNum}`);
                    
                    imgElement.onload = function() {
                        imgElement.style.display = 'block';
                        console.log(`Dataset ${datasetNum} floor plan image displayed`);
                        if (datasetNum === 1) {
                            currentImageElement1 = imgElement;
                        } else {
                            currentImageElement2 = imgElement;
                        }
                        renderDots();
                    };
                    
                    imgElement.src = imageUrl;
                } else {
                    console.warn(`Dataset ${datasetNum} floor_plan.jpg not found in the ZIP file`);
                }
            } catch (error) {
                console.error(`Error processing ZIP file ${datasetNum}:`, error);
            }
        }
